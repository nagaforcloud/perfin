services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: perfin
      POSTGRES_PASSWORD: perfin
      POSTGRES_DB: perfin
    ports:
      - '5433:5432'
    volumes:
      - perfin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perfin']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  perfin_pg:
